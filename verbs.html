<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verbs — German Learning Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ef;--panel:#fff;--ink:#1e1e1e;--sub:#777;--muted:#aaa;
  --accent:#2d6a4f;--accent-l:#d8f3dc;--accent-d:#1b4332;
  --border:#e4e0da;--card:#fafaf8;
  --shadow:0 1px 3px rgba(0,0,0,.07);--radius:10px;
}
body.dark{
  --bg:#171a17;--panel:#20241f;--ink:#eae7e0;--sub:#9a9990;--muted:#6b6a63;
  --accent:#5cb583;--accent-l:#243d2f;--accent-d:#8fd6ac;
  --border:#333630;--card:#262a25;--shadow:0 1px 3px rgba(0,0,0,.3);
}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;transition:background .15s,color .15s}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px}
.top-bar{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:10}
.top-bar button,.top-bar a{height:38px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.top-bar a{width:auto;border-radius:99px;padding:0 14px;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none}

.top{margin-bottom:8px}
.top .kicker{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.top h1{font-size:24px;font-weight:800;color:var(--accent-d);margin-top:4px}
.top .sub{font-size:13.5px;color:var(--sub);margin-top:6px;max-width:560px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:20px}
.mcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s}
.mcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.mcard .icon{font-size:26px}
.mcard h2{font-size:15.5px;font-weight:700}
.mcard p{font-size:12.5px;color:var(--sub);flex:1}
.mcard .open{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}

.ghost{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.ghost .icon{opacity:.5}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" title="Back to home">🏠 Home</a>
  <button class="mode-toggle" id="modeBtn" title="Toggle dark mode">🌙</button>
</div>
<div class="wrap">
  <div class="top">
    <div class="kicker">German Learning Hub</div>
    <h1>Verbs</h1>
    <div class="sub">One deep-dive per verb — full conjugation across every tense, real examples, and its role as a helper verb where relevant.</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const VERBS = [
  {icon:"🔤", title:"sein", desc:"to be — the most irregular, most common verb, and the helper verb for movement/change-of-state verbs.", href:"verb-sein.html"},
  {icon:"🤲", title:"haben", desc:"to have — the default helper verb for almost every other verb's Perfekt tense, plus its own idioms.", href:"haben.html"},
  {icon:"🔄", title:"werden", desc:"to become — plus the engine behind Futur tense, the entire passive voice, and the würde-conditional.", href:"verb-werden.html"},
  {icon:"💪", title:"können", desc:"can / to be able to — ability, possibility, and the standard way to make a polite request.", href:"verb-koennen.html"},
  {icon:"⚠️", title:"müssen", desc:"must / to have to — necessity and obligation, plus the nicht müssen vs. nicht dürfen trap.", href:"verb-muessen.html"}
];

function render(){
  const g=document.getElementById('grid');
  g.innerHTML = VERBS.map(v=>`
    <a class="mcard" href="${v.href}">
      <div class="icon">${v.icon}</div>
      <h2>${v.title}</h2>
      <p>${v.desc}</p>
      <div class="open">Open →</div>
    </a>
  `).join('') + `
    <div class="mcard ghost">
      <div class="icon">➕</div>
      <p>Next verb goes here</p>
    </div>
  `;
}
render();

function initMode(){
  const saved=localStorage.getItem('a1-dark');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  setMode(saved!==null?saved==='1':prefersDark);
}
function setMode(dark){
  document.body.classList.toggle('dark',dark);
  document.getElementById('modeBtn').textContent=dark?'☀️':'🌙';
  try{localStorage.setItem('a1-dark',dark?'1':'0');}catch(e){}
}
document.getElementById('modeBtn').onclick=()=>setMode(!document.body.classList.contains('dark'));
initMode();
</script>
</body>
</html>
