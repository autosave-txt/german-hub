<head>
<meta charset="UTF-8">

<title>Menschen A1 — Interactive Study Guide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent2:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:1rem}
.topbar{position:sticky;top:0;z-index:100;background:rgba(13,17,23,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0.75rem 1rem;display:flex;align-items:center;gap:0.75rem}
.topbar h1{font-size:1.1rem;font-weight:600;color:var(--accent);white-space:nowrap}
.topbar select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.4rem 0.6rem;font-size:0.85rem;flex:1;max-width:300px}
.module-header{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin:1.5rem 0 1rem}
.module-header h2{font-size:1.1rem;color:var(--accent);margin-bottom:0.25rem}
.module-header p{font-size:0.85rem;color:var(--text2)}
.lesson{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:0.75rem;overflow:hidden}
.lesson-head{padding:1rem 1.25rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background 0.2s}
.lesson-head:hover{background:var(--surface2)}
.lesson-head h3{font-size:0.95rem;color:var(--text)}
.lesson-head .topic{font-size:0.8rem;color:var(--text2);margin-top:0.15rem}
.lesson-head .arrow{color:var(--text2);font-size:1.2rem;transition:transform 0.3s}
.lesson-head.open .arrow{transform:rotate(180deg)}
.lesson-body{display:none;padding:0 1.25rem 1.25rem}
.lesson-body.show{display:block;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:0;margin-bottom:1rem;border-bottom:1px solid var(--border)}
.tab{padding:0.5rem 1rem;font-size:0.8rem;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}
.dialogue-row{display:flex;align-items:flex-start;gap:0.5rem;padding:0.6rem 0;border-bottom:1px solid rgba(48,54,61,0.5)}
.dialogue-row:last-child{border-bottom:none}
.speak-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:1rem;padding:0.2rem;border-radius:4px;flex-shrink:0;transition:all 0.15s;line-height:1}
.speak-btn:hover{background:rgba(88,166,255,0.15);transform:scale(1.15)}
.speak-btn:active{transform:scale(0.95)}
.speak-btn.playing{color:var(--accent2);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.de-text{font-weight:600;color:var(--text);font-size:0.93rem;cursor:help;position:relative;display:inline}
.tooltip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:0;background:#1f2937;color:var(--text2);font-size:0.82rem;font-weight:400;padding:0.45rem 0.75rem;border-radius:6px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,0.5);pointer-events:none;max-width:340px;white-space:normal;line-height:1.4}
.tooltip-box::after{content:'';position:absolute;top:100%;left:16px;border:6px solid transparent;border-top-color:#1f2937}
.de-text:hover .tooltip-box{display:block}
.grammar-item{background:var(--surface2);border-radius:6px;padding:0.5rem 0.75rem;margin-bottom:0.4rem;font-size:0.88rem;color:var(--text);display:flex;align-items:flex-start;gap:0.5rem}
.grammar-item.header{background:none;padding:0.7rem 0 0.2rem;font-weight:700;color:var(--orange);font-size:0.85rem}
.grammar-spacer{height:0.5rem}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:8px;overflow:hidden}
.vocab-grid .vheader{background:var(--surface2);padding:0.5rem 0.75rem;font-size:0.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.05em}
.vocab-cell{background:var(--surface);padding:0.45rem 0.75rem;font-size:0.86rem;display:flex;align-items:center;gap:0.35rem;transition:background 0.15s}
.vocab-cell:hover{background:var(--surface2)}
.vocab-cell.de{font-weight:600;color:var(--text)}
.vocab-cell.en{color:var(--text2)}
.vocab-cell .speak-btn{font-size:0.85rem;padding:0.1rem}
.search-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.6rem 1rem;color:var(--text);font-size:0.9rem;width:100%;margin-bottom:1rem;outline:none;transition:border-color 0.2s}
.search-bar:focus{border-color:var(--accent)}
.search-bar::placeholder{color:var(--text2)}
.footer{text-align:center;padding:2rem 0;color:var(--text2);font-size:0.8rem}
@media(max-width:600px){.container{padding:0.5rem}.topbar h1{font-size:0.95rem}.tooltip-box{left:-10px;max-width:250px}.vocab-grid{font-size:0.8rem}}
</style>
</head>

          {de:"Herzlichen Glückwunsch! / Alles Gute!",en:"Congratulations! / All the best!"},
          {de:"Frohe Weihnachten! / Gutes neues Jahr!",en:"Merry Christmas! / Happy New Year!"},
        ],
        grammar: [
          "**würde + infinitive (would):**",
          "ich würde / du würdest / Sie würden / er·sie würde",
          "wir würden / ihr würdet / sie würden",
          "",
          "**Ordinal numbers:**",
          "1.-19. add -te: der erste, zweite, dritte, vierte...",
          "20.+ add -ste: der zwanzigste...",
          "",
          "**Dates:** Heute ist der achte Januar. / Am achten Januar.",
        ],
        vocab: [
          ["feiern","to celebrate"],["der Geburtstag","birthday"],
          ["Weihnachten","Christmas"],["Silvester / Neujahr","New Year's Eve / New Year"],
          ["Ostern","Easter"],["das Geschenk","gift/present"],
          ["Herzlichen Glückwunsch!","Congratulations!"],["Alles Gute!","All the best!"],
          ["Frohe Weihnachten!","Merry Christmas!"],["Gut gemacht!","Well done!"],
          ["würde","would"],["die Reise","trip/journey"],
        ]
      },
    ]
  },
];


let currentBtn = null;

function speak(text, btn) {
  speechSynthesis.cancel();
  if (currentBtn) currentBtn.classList.remove('playing');
  if (currentBtn === btn) { currentBtn = null; return; }
  text = text.replace(/\//g, ', ').replace(/—/g, ', ').replace(/·/g, ' ')
             .replace(/\(.*?\)/g, '').replace(/\.{2,}/g, '').trim();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 0.82;
  const voices = speechSynthesis.getVoices();
  const dv = voices.find(v => v.lang.startsWith('de'));
  if (dv) u.voice = dv;
  btn.classList.add('playing'); currentBtn = btn;
  u.onend = () => { btn.classList.remove('playing'); currentBtn = null; };
  u.onerror = () => { btn.classList.remove('playing'); currentBtn = null; };
  speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
speechSynthesis.getVoices();

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function render(filter) {
  const el = document.getElementById('content');
  const jump = document.getElementById('jumpTo');
  let h = '', jh = '<option value="">Jump to lesson...</option>';
  const fl = (filter||'').toLowerCase();

  LESSONS.forEach((mod, mi) => {
    let mh = '';
    mod.lessons.forEach((les, li) => {
      const id = 'L'+mi+'_'+li;
      if (fl) {
        const blob = JSON.stringify(les).toLowerCase();
        if (!blob.includes(fl)) return;
      }
      jh += '<option value="'+id+'">'+esc(les.title)+'</option>';

      // Dialogues
      let dh = '';
      les.dialogues.forEach(d => {
        dh += '<div class="dialogue-row">'
          + '<button class="speak-btn" onclick="speak(\''+escAttr(d.de)+'\',this)" title="Listen">&#x1F50A;</button>'
          + '<div><span class="de-text">'+esc(d.de)+'<span class="tooltip-box">'+esc(d.en)+'</span></span></div>'
          + '</div>';
      });

      // Grammar
      let gh = '';
      les.grammar.forEach(g => {
        if (g === '') { gh += '<div class="grammar-spacer"></div>'; return; }
        if (g.startsWith('**')) {
          gh += '<div class="grammar-item header">'+esc(g.replace(/\*\*/g,''))+'</div>';
        } else {
          const hasDE = /[\u00e4\u00f6\u00fc\u00df\u00c4\u00d6\u00dc]|\bich\b|\bdu\b|\bSie\b|\ber\b|\bwir\b/i.test(g);
          gh += '<div class="grammar-item">'
            + (hasDE ? '<button class="speak-btn" onclick="speak(\''+escAttr(g)+'\',this)">&#x1F50A;</button>' : '')
            + '<span>'+esc(g)+'</span></div>';
        }
      });

      // Vocab
      let vh = '<div class="vocab-grid"><div class="vheader">German</div><div class="vheader">English</div>';
      les.vocab.forEach(([de, en]) => {
        vh += '<div class="vocab-cell de"><button class="speak-btn" onclick="speak(\''+escAttr(de)+'\',this)">&#x1F50A;</button>'+esc(de)+'</div>'
            + '<div class="vocab-cell en">'+esc(en)+'</div>';
      });
      vh += '</div>';

      mh += '<div class="lesson" id="'+id+'">'
        + '<div class="lesson-head" onclick="toggle(this)">'
        + '<div><h3>'+esc(les.title)+'</h3><div class="topic">'+esc(les.topic)+'</div></div>'
        + '<span class="arrow">&#x25BE;</span></div>'
        + '<div class="lesson-body">'
        + '<div class="tabs">'
        + '<div class="tab active" onclick="stab(this,\'d'+id+'\')">Dialogues</div>'
        + '<div class="tab" onclick="stab(this,\'g'+id+'\')">Grammar</div>'
        + '<div class="tab" onclick="stab(this,\'v'+id+'\')">Vocabulary</div>'
        + '</div>'
        + '<div class="tab-content active" id="d'+id+'">'+dh+'</div>'
        + '<div class="tab-content" id="g'+id+'">'+gh+'</div>'
        + '<div class="tab-content" id="v'+id+'">'+vh+'</div>'
        + '</div></div>';
    });
    if (!fl || mh) {
      h += '<div class="module-header"><h2>'+esc(mod.module)+'</h2><p>'+esc(mod.moduleTitle)+'</p></div>' + mh;
    }
  });
  el.innerHTML = h;
  jump.innerHTML = jh;
}

function toggle(el) {
  const body = el.nextElementSibling;
  const open = body.classList.contains('show');
  document.querySelectorAll('.lesson-body.show').forEach(b => { b.classList.remove('show'); b.previousElementSibling.classList.remove('open'); });
  if (!open) { body.classList.add('show'); el.classList.add('open'); }
}

function stab(tabEl, id) {
  const p = tabEl.closest('.lesson-body');
  p.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  p.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  tabEl.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function jumpToLesson(id) {
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  const h = el.querySelector('.lesson-head'), b = el.querySelector('.lesson-body');
  if (!b.classList.contains('show')) {
    document.querySelectorAll('.lesson-body.show').forEach(x => { x.classList.remove('show'); x.previousElementSibling.classList.remove('open'); });
    b.classList.add('show'); h.classList.add('open');
  }
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

let ft;
function doFilter(v) { clearTimeout(ft); ft = setTimeout(() => render(v), 200); }

render();
</script>
